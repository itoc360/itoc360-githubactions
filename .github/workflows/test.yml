name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # GitHub runs the action straight from the repository, so a stale bundle
  # would silently ship old behaviour. This rebuilds and fails if the result
  # differs from what is committed.
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Compare the rebuilt bundle with the committed one
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat dist/
            exit 1
          fi
          echo "dist/ is up to date."

  # Runs the action as a consumer would, against a source token held as a
  # secret. It is skipped on forks and whenever the secret is absent.
  self-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Raise a test alert
        id: alert
        if: vars.SELF_TEST == 'true'
        uses: ./
        with:
          token: ${{ secrets.ITOC360_TOKEN }}
          severity: low
          title: "itoc360-action self-test"
          fingerprint: "itoc360-action::self-test"
          fail-on-error: false

      - name: Resolve it again
        if: vars.SELF_TEST == 'true'
        uses: ./
        with:
          token: ${{ secrets.ITOC360_TOKEN }}
          status: resolve
          title: "itoc360-action self-test cleared"
          fingerprint: "itoc360-action::self-test"
          fail-on-error: false
